name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend test (Vitest)
        run: pnpm test

      - name: Backend test (cargo test)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build DMG (ad-hoc signed)
        run: ./scripts/build-dev.sh

      - uses: actions/upload-artifact@v4
        with:
          name: runcode-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend test (Vitest)
        run: pnpm test

      - name: Backend test (cargo test)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cache TDM-GCC
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/mingw64
          key: tdm-gcc-10.3.0-2-v1

      - name: Prepare TDM-GCC
        run: ./scripts/prepare-tdm-gcc.ps1
        shell: pwsh

      - name: Build NSIS installer
        run: ./scripts/build-windows.ps1
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: runcode-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
